name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "dd --version  (or git commit)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, other]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Commands
      description: Exact `dd` commands (redact secrets).
      render: shell
