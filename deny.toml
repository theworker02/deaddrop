[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive via parking_lot; not something this workspace can replace.
    "RUSTSEC-2024-0384",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "LicenseRef-Proprietary",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses.private]
ignore = true
